name: Auto-merge cursor PRs

# When CI succeeds on a cursor/* PR targeting main, merge it.
# Push to main then triggers Docker publish + GitHub Pages deploy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Find and merge matching PR
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headBranch = run.head_branch;
            const headSha = run.head_sha;

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${headBranch}`,
              base: 'main',
            });

            let pr = prs.find((p) => p.head.sha === headSha) ?? prs[0];
            if (!pr) {
              core.info(`No open PR found for ${headBranch}@${headSha}`);
              return;
            }

            if (pr.base.ref !== 'main') {
              core.info(`Skipping PR #${pr.number}: base is ${pr.base.ref}`);
              return;
            }

            // REST cannot undraft — use GraphQL markPullRequestReadyForReview.
            if (pr.draft) {
              const { data: full } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });
              await github.graphql(
                `mutation($id: ID!) {
                  markPullRequestReadyForReview(input: { pullRequestId: $id }) {
                    pullRequest { id isDraft }
                  }
                }`,
                { id: full.node_id },
              );
              const refreshed = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });
              pr = refreshed.data;
              if (pr.draft) {
                core.setFailed(`PR #${pr.number} is still a draft after markReady`);
                return;
              }
              core.info(`Marked PR #${pr.number} ready for review`);
            }

            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: pr.head.sha,
              per_page: 100,
            });
            const failed = checkRuns.filter(
              (c) =>
                c.name !== 'merge' &&
                c.conclusion &&
                !['success', 'neutral', 'skipped'].includes(c.conclusion),
            );
            if (failed.length) {
              core.setFailed(
                `Checks not green on ${pr.head.sha}: ${failed.map((c) => `${c.name}=${c.conclusion}`).join(', ')}`,
              );
              return;
            }

            core.info(`Merging PR #${pr.number} (${pr.title})`);
            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'merge',
              commit_title: `Merge pull request #${pr.number} from ${pr.head.label}`,
              commit_message: pr.title,
            });
            core.info(`Merged PR #${pr.number}; deploy workflows will run on main.`);
